services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youth-computing-backend
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      CORS_ORIGIN: http://localhost:3000,http://localhost:3100
      FRONTEND_URL: http://localhost:3000
      ENABLE_SOCKET: "true"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/youth_computing?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
      - uploads_data:/app/uploads
    networks:
      - yc-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: youth-computing-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: youth_computing
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youth_computing"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: youth-computing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yc-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: youth-computing-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@youthcomputing.mg
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - yc-network
    restart: unless-stopped

networks:
  yc-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
  uploads_data:
